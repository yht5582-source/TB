:root{--ink:#182737;--muted:#536571;--teal:#087e83;--line:#d7e0e5;--pale:#f3f7f9;--red:#a42b36}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}button,input,select{font:inherit}button,a,input,select,summary{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--teal);padding:9px 16px;border-radius:6px;font-weight:600}button:hover{background:#edf6f6}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #e2aa39;outline-offset:3px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding:22px 32px}header .brand{display:flex;align-items:center;gap:18px}header strong{font-size:25px;letter-spacing:.02em}header .mark{font-size:32px;color:var(--teal);line-height:1;border-right:1px solid var(--teal);padding-right:18px;font-weight:800}.tools{display:flex;gap:10px}.shell{display:grid;grid-template-columns:220px minmax(0,1fr) 280px;max-width:1600px;margin:auto;min-height:calc(100vh - 155px)}nav{background:linear-gradient(#f6f9fa,#eff4f6);border-right:1px solid var(--line);padding:28px 12px;display:flex;flex-direction:column;gap:10px}.step{width:100%;display:flex;align-items:center;gap:12px;text-align:left;color:var(--ink);background:#eaf0f3;border:0;padding:17px 13px;font-size:17px}.step b{font-size:23px}.step.active{background:var(--teal);color:white}.nav-foot{margin-top:auto;padding:25px 8px 0;font-size:13px;color:var(--muted)}.nav-foot button{font-size:14px;padding:7px 10px;margin:5px 0}main{padding:32px 34px;min-width:0}aside{border-left:1px solid var(--line);padding:28px 22px;background:#fff}aside h2{font-size:25px;margin:0 0 18px}aside h3{font-size:18px;padding-top:22px;border-top:1px solid var(--line);margin-top:24px}aside p,aside li{font-size:14px}#rail-dx{padding:2 sition{color:var(--muted);font-size:13px}#demo-name{font-size:13px;color:var(--teal);margin-bottom:12px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:12px 10px;text-align:left;vertical-align:top}th{background:var(--pale);font-weight:700}.timeline{border-left:2px solid #c1d8db;padding-left:20px}.timeline p{font-size:14px}.timeline b{display:block;color:var(--teal)}footer{background:#eff3f5;border-top:1px solid var(--line);padding:14px 30px;display:flex;justify-content:space-between;gap:20px;font-size:12px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:10px;padding:25px;max-width:720px;width:calc(100% - 30px);max-height:85vh;overflow:auto;color:var(--ink)}dialog::backdrop{background:#132b3f88}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.dialog-head h2{margin:0;font-size:23px}#cases{display:grid;gap:9px}#cases button{text-align:left;color:var(--ink);padding:14px}#cases span{color:var(--teal);padding-right:17px}a{color:var(--teal);text-underline-offset:3px}#sources p{font-size:13px;color:var(--muted)}[hidden]{display:none!important}#print-summary{display:none}#mini-status{display:none}.skip{position:absolute;left:-9999px}.skip:focus{left:10px;top:10px;background:white;z-index:9;padding:10px}

</style></head><body><a class="skip" href="#main">跳到主要內容</a><header><div class="brand"><span class="mark">TB</span><strong>結核病臨床導航</strong></div><div class="tools"><button id="demo">示範病例</button><button id="print">列印摘要</button></div></header><div class="shell"><nav aria-label="診療步驟"><div id="steps"></div><div class="nav-foot"><p>從疑似到診斷，<br>從處方到追蹤。</p><button id="quiz-btn">20題自我測驗</button><button id="map-btn">詳盡心智圖</button><button id="sources-btn">指引來源 ↗</button><button id="reset">清除重填</button><p>指引查核：2026-11-10<br>WHO・ATS／CDC／ERS／IDSA</p></div></nav><main id="main"><div id="demo-name"></div><p class="note" id="case-teaching" hidden></p><div id="mini-status" aria-live="polite"></div><div id="alerts"></div><div id="panels"></div><div class="pager"><button id="prev">← 上一步</button><span id="position"></span><button class="primary" id="next">下一步 →</button></div></main><aside aria-label="即時評估"><h2>即時評估</h2><p id="rail-dx" aria-live="polite"></p><h3>下一步採檢</h3><div id="rail-next"></div><h3>療程定位</h3><p id="rail-rx"></p><div id="rail-missing"></div></aside></div><footer><span>臨床決策輔助，需由醫師確認。無自動處方、無個人存活率推估。</span><span>國際建議須核對台灣現行規範・v1.1</span></footer><dialog id="case-dialog"><div class="dialog-head"><h2>載入示範病例</h2><button id="case-close" aria-label="關閉示範病例">關閉</button></div><p class="note">共8例基本＋4例複雜，皆為虛構教學病例。載入會取代目前表單；不含可識別病人資料。</p><div id="cases"></div></dialog><dialog id="sources-dialog"><div class="dialog-head"><h2>指引與判讀依據</h2><button id="sources-close" aria-label="關閉指引來源">關閉</button></div><p>查核日：2026-11-10。規則採保守篩選；不以自訂加總分數替代專科判斷。新版指引或公費條件異動時需重新審查。</p><ol id="sources"></ol></dialog><dialog id="reset-dialog"><h2>清除目前資料？</h2><p>清除後回到空白評估，無法還原。</p><button id="reset-cancel">取消</button> <button id="reset-confirm" class="primary">清除重填</button></dialog><section id="print-summary"></section><script>/* TB Clinical Navigator — deterministic decision support, reviewed 2026-11-10. */
(function(root){
const isYes=(s,k)=>s[k]==='yes';
const EXTRA=['pleural','node','cns','bone','other'];
const num=(s,k)=>s[k]!==''&&s[k]!=null&&Number.isFinite(Number(s[k]))?Number(s[k]):null;
function assess(s){
 const age=num(s,'age'),w=num(s,'weight'),cr=num(s,'crcl');
 const alt=num(s,'alt');
 const liverAlert=alt!==null&&(alt>=5||(alt>=3&&isYes(s,'hepatitis')));
 const urgent=['resp','shock','hemoptysis','neuro'].filter(k=>isYes(s,k));
 const symptoms=['cough','fever','loss','night'].some(k=>isYes(s,k));
 const image=['suggestive','cavity','miliary'].includes(s.image);
 const positive=s.naat==='positive'||s.culture==='positive';
 const suspect=symptoms||image||s.smear==='positive'||(isYes(s,'contact')&&!isYes(s,'excluded'))||isYes(s,'clinical');
 const conflicts=[];
 if(isYes(s,'excluded')&&(positive||image||symptoms||isYes(s,'clinical')))conflicts.push('「已排除活動性結核」與目前症狀／影像／病原結果衝突；先重新確認，不可進入潛伏感染單藥治療。');
 if(s.rif==='resistant'&&s.naat==='negative'&&s.culture==='negative')conflicts.push('R 抗藥結果與兩項陰性病原結果不一致，請核對檢體、日期及檢驗方法。');
 let dx='資料不足，尚待評估',code='incomplete',detail='先完成症狀、影像與病原檢驗，未填資料不等於正常。';
 if(positive){code='confirmed';dx='病原學支持活動性結核';detail='MTB 核酸或培養陽性；須結合病史及檢體部位，完成藥敏。';if(isYes(s,'past')&&s.naat==='positive'&&s.culture!=='positive'){code='review';dx='MTB 核酸陽性，需確認是否活動性';detail='曾治療者可能殘留核酸；評估新症狀、影像變化與培養，不能單靠核酸判定復發。';}}
 else if(isYes(s,'clinical')){code='clinical';dx='臨床診斷活動性結核';detail='由醫師綜合證據及排除替代診斷後判定；檢體陰性不排除，需持續評估治療反應。';}
 else if(suspect){code='suspected';dx='疑似活動性結核，須進一步採檢';detail='陰性塗片或核酸不能完全排除；若重症／高度懷疑，採檢後由醫師決定經驗性治療。';}
 else if(isYes(s,'excluded')&&s.igra==='positive'){code='ltbi';dx='符合潛伏結核感染評估路徑';detail='感染檢測陽性且已完成活動性疾病排除；依接觸源藥敏與個別條件選擇預防療程。';}
 else if(isYes(s,'excluded')){code='noactive';dx='目前評估未見活動性結核';detail=s.igra==='negative'?'感染檢測陰性仍須考量免疫抑制與接觸窗口期；有新症狀時重新評估。':s.igra==='indeterminate'?'感染檢測無法判讀：考慮重驗或改用另一種檢測；免疫抑制者不能據此排除感染。':'尚未提供IGRA／TST結果：如有接觸或預防治療適應症，先完成感染檢測再決定是否進入潛伏感染路徑。';}
 if(conflicts.length){code='conflict';dx='資料衝突：請先重新評估';detail=conflicts.join(' ');}
 const next=[];
 const screening=['ltbi','noactive'].includes(code);
 const extra=EXTRA.includes(s.site);
 if(screening){
  if(code==='ltbi')next.push('核對接觸源藥敏；接觸抗藥結核者另循專門預防指引。','預防治療前確認肝功能基線、肝病／飲酒、懷孕、HIV及rifamycin交互作用。');
  else if(s.igra!=='negative')next.push('完成或重驗IGRA／TST，確認是否需預防治療。');
  if(isYes(s,'contact'))next.push('接觸者如初次檢測陰性且仍在窗口期，依規範約8–10週後重驗。');
 }else{
 if(s.site==='unknown')next.push('先確認感染部位（肺／喉或肺外），決定採檢方式及療程長度。');
 if(s.naat==='unknown')next.push('取得病灶檢體，安排 MTB 核酸及快速 R 抗藥檢測。');
 if(s.culture!=='positive')next.push('取得足量檢體送分枝桿菌培養、菌種鑑定及藥敏；若已送驗則追蹤結果。');
 if(s.smear==='positive'&&s.naat==='negative')next.push('AFB 陽性／MTB 核酸陰性：考慮 NTM、檢體抑制或技術因素，複驗並等待菌種。');

 if(extra)next.push('肺外病灶：組織／體液送培養、適用核酸及病理；陰性不能排除。');
 if(s.image==='unknown')next.push('完成胸部 X 光，必要時 CT；肺外結核也應評估是否合併肺部感染。');
 if(s.rif==='unknown'||s.inh==='unknown')next.push('補足 R／H 藥敏；若 R 抗藥，再加速 FQ 與核心二線藥敏。');
 }
 const renal=isYes(s,'hd')||isYes(s,'pd')||(cr!==null&&cr<30);
 const active=['confirmed','clinical'].includes(code);
 let treatment={title:'先完成診斷及藥敏評估',kind:'pending',duration:'尚未決定',lines:['不可將 IGRA 陽性直接當作活動性結核，也不可將陰性檢驗直接當成排除。'],short:false};
 let shortReasons=[];
 if(active){
  if(s.rif==='resistant'){
   let elig=age!==null&&age>=14&&s.preg==='no'&&s.breast==='no'&&!['cns','bone'].includes(s.site)&&s.core==='no';
   treatment={kind:'dr',duration:'符合資格者約6個月；仍須專責團隊確認',title:'R 抗藥結核：轉抗藥結核專責團隊',short:false,lines:[]};
   if(s.site==='unknown')treatment.lines.push('感染部位尚未確認：先確認是否為肺部病灶，再判定短療程資格。');
   else if(s.site!=='pulmonary')treatment.lines.push('肺外R抗藥結核：本工具不自動指定肺部短療程；依感染部位與核心藥敏由專責團隊個別化。');
   else if(s.fq==='sensitive')treatment.lines.push('候選方案：BPaLM（bedaquiline＋pretomanid＋linezolid＋moxifloxacin）。');
   else if(s.fq==='resistant')treatment.lines.push(s.severity==='severe'?'WHO 2026：重症肺部 pre-XDR 候選 BPaLC（加 clofazimine）。':s.severity==='nonsevere'?'WHO 2026：非重症肺部 pre-XDR 候選 BPaL。':'FQ 抗藥：先判定重症程度，再由團隊選擇 BPaL／BPaLC 或其他方案。');
   else treatment.lines.push('FQ 藥敏未明：立即補驗；由專責團隊決定初始全口服方案，不能自動刪除 moxifloxacin。');
   if(!elig)treatment.lines.push('短療程資格尚未完整確認或存在限制：年齡、懷孕／哺乳、感染部位、核心藥物既往暴露及藥敏均須審查。');
   treatment.lines.push('本工具不自動開立二線藥劑量；須評估核心藥敏、QTc、血球、肝功能、周邊／視神經毒性及交互作用。');
  }else if(s.inh==='resistant'&&s.rif==='sensitive'){
   treatment={kind:'hr',title:'INH 抗藥、R 敏感結核：專家確認處方',duration:'通常6個月',short:false,lines:['可評估 R＋E＋Z＋levofloxacin 的6個月方案，須確認 FQ 藥敏、Z／E 可用及感染部位。','腎功能不全時 levofloxacin、Z、E 需調整；不可照用一般2HRZE／4HR。']};
  }else if(s.inh==='resistant'||s.pza==='resistant'||s.fq==='resistant'){
   treatment={kind:'other',title:'有個別藥物抗藥：需調整方案',duration:'依藥敏與部位決定',short:false,lines:['先釐清完整藥敏，交由結核專家制定有效多藥組合。','若僅 Z 抗藥／不可用且 H、R 確定敏感，常需總療程9個月。']};
  }else{
   treatment={kind:'ds',title:s.rif==='sensitive'&&s.inh==='sensitive'?'藥敏感結核：標準6個月療程':'推定藥敏感結核：初始四藥，等待藥敏',duration:'2HRZE／4HR，共6個月',short:false,lines:['前2個月 H＋R＋Z＋E；後4個月 H＋R。藥敏確定後由醫師決定 E 停用時點。','採每日給藥及都治／視訊都治支持；腎功能相關 Z／E 給藥間隔另見劑量表。']};
   if(s.site==='cns'){treatment.duration='成人通常9–12個月';treatment.lines.push('結核性腦膜炎：專科住院評估，合併 dexamethasone 或 prednisolone，通常於6–8週逐漸減量。');}

 document.querySelectorAll('[name="quizanswer"]').forEach(el=>el.onchange=()=>{answers[qi]=Number(el.value)});
 document.querySelector('#qprev').onclick=()=>{qi--;renderQuiz()};document.querySelector('#qnext').onclick=()=>{qi++;renderQuiz()};
 document.querySelector('#qcheck').onclick=()=>{if(answers[qi]===null){document.querySelector('#quiz-feedback').textContent='請先選擇一個答案。';return;}document.querySelector('#quiz-feedback').textContent='';locked[qi]=true;renderQuiz();document.querySelector('#quiz-body .explain')?.setAttribute('tabindex','-1');document.querySelector('#quiz-body .explain')?.focus()};
}
document.body.insertAdjacentHTML('beforeend',`<dialog id="quiz-dialog"><div class="dialog-head"><h2>20題臨床自我測驗</h2><button id="quiz-close">關閉</button></div><p class="note">10題基礎＋10題高階。每題確認後顯示答案、解析與指引依據；尚未作答不計入分數。關閉後保留本次進度，重整頁面即清除。</p><div id="quiz-body"></div><p id="quiz-feedback" role="status"></p><button id="quiz-restart">重新開始測驗</button></dialog><dialog id="map-dialog"><div class="dialog-head"><h2>結核病詳盡心智圖</h2><button id="map-close">關閉</button></div><p>點選各分支展開；以診斷、藥敏、療程及動態反應串聯決策。可直接在此收合，不需離開評估頁。</p><div class="map-tools"><button id="map-expand">全部展開</button><button id="map-collapse">全部收合</button></div><div class="mind-root">結核病臨床決策</div><div id="mindmap"></div><p class="source">整合WHO 2025／2026、ATS／CDC／ERS／IDSA及CDC。詳細來源請見「指引來源」；實際臨床及公費使用依台灣現行規範。</p></dialog>`);
document.querySelector('#mindmap').innerHTML=mapData.map(([title,branches])=>`<details class="mind-branch"><summary>${esc(title)}</summary><div>${branches.map(([sub,leaves])=>`<details class="mind-sub"><summary>${esc(sub)}</summary>${list(leaves)}</details>`).join('')}</div></details>`).join('');
document.querySelector('#quiz-btn').onclick=()=>{renderQuiz();document.querySelector('#quiz-dialog').showModal()};
document.querySelector('#quiz-close').onclick=()=>document.querySelector('#quiz-dialog').close();
document.querySelector('#quiz-restart').onclick=()=>{answers.fill(null);locked.fill(false);qi=0;renderQuiz();document.querySelector('#quiz-feedback').textContent='已重新開始。'};
document.querySelector('#map-btn').onclick=()=>document.querySelector('#map-dialog').showModal();
document.querySelector('#map-close').onclick=()=>document.querySelector('#map-dialog').close();
document.querySelector('#map-expand').onclick=()=>document.querySelectorAll('#mindmap details').forEach(d=>d.open=true);
document.querySelector('#map-collapse').onclick=()=>document.querySelectorAll('#mindmap details').forEach(d=>d.open=false);
</script></body></html>
